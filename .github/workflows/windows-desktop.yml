name: Windows Desktop GUI

on:
  push:
    branches: [main]
    paths:
      - "apps/c2l-desktop/**"
      - "crates/c2l-scanner/**"
      - "crates/c2l-hashing/**"
      - "crates/c2l-indicators/**"
      - "crates/c2l-detection/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "apps/c2l-desktop/**"
      - "crates/c2l-scanner/**"
      - "crates/c2l-hashing/**"
      - "crates/c2l-indicators/**"
      - "crates/c2l-detection/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/c2l-desktop -> target

      - name: Apply Rust formatting in CI workspace
        run: cargo fmt --manifest-path apps/c2l-desktop/Cargo.toml

      - name: Check GUI code
        run: cargo clippy --manifest-path apps/c2l-desktop/Cargo.toml --all-targets -- -D warnings

      - name: Run GUI logic tests
        run: cargo test --manifest-path apps/c2l-desktop/Cargo.toml

      - name: Build Windows application
        run: cargo build --manifest-path apps/c2l-desktop/Cargo.toml --release

      - name: Upload unsigned Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: c2l-antivirus-windows-prototype
          path: apps/c2l-desktop/target/release/c2l-desktop.exe
          if-no-files-found: error
          retention-days: 14
