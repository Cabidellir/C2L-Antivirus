name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "crates/c2l-hashing/**"
      - "crates/c2l-detection/**"
      - "crates/c2l-indicators/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/c2l-hashing/**"
      - "crates/c2l-detection/**"
      - "crates/c2l-indicators/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK (ARM64 and x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            android/native -> target

      - name: Verify native Rust tests
        run: cargo test --manifest-path android/native/Cargo.toml

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile Rust JNI libraries
        run: >
          cargo ndk -t arm64-v8a -t x86_64
          -o android/app/src/main/jniLibs
          build --release --manifest-path android/native/Cargo.toml

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned debug APK
        run: gradle --project-dir android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: c2l-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
