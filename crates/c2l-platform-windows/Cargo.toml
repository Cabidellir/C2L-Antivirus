[package]
name = "c2l-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
c2l-platform = { path = "../c2l-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }
