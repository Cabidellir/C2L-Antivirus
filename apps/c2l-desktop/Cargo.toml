[package]
name = "c2l-desktop"
version = "0.5.2"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "c2l-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
c2l-scanner = { path = "../../crates/c2l-scanner" }
c2l-indicators = { path = "../../crates/c2l-indicators" }
c2l-detection = { path = "../../crates/c2l-detection" }
rusqlite = { version = "0.40", features = ["bundled"] }
c2l-hashing = { path = "../../crates/c2l-hashing" }
c2l-platform-windows = { path = "../../crates/c2l-platform-windows" }
notify = "8.2"

# Separate build to keep graphics dependencies outside the headless scanner workspace.
[workspace]
resolver = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
